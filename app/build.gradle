apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

androidExtensions {
    experimental = true
}

android {
    compileSdkVersion 30
    defaultConfig {
        applicationId "net.frju.flym.fork"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 43
        versionName "2.5.9"
    }

    // Flym currently has no native .so libraries of its own. ABI splits would therefore
    // produce byte-for-byte identical APKs, so publish one regular APK instead.

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        kotlinOptions {
            jvmTarget = "1.8"
        }
    }

    lintOptions {
        // if true, stop the gradle build if errors are found
        abortOnError true
    }

    File localProps = project.rootProject.file('local.properties')
    Properties properties = new Properties()
    if (localProps.exists()) {
        properties.load(localProps.newDataInputStream())
    }

    def getConfigValue = { String propertyName, String envName ->
        project.findProperty(propertyName) ?: System.getenv(envName) ?: properties.getProperty(propertyName)
    }

    def legacyKeystorePath = getConfigValue('KEYSTORE_PATH', 'KEYSTORE_PATH')
    def legacyKeystorePassword = getConfigValue('KEYSTORE_PASSWORD', 'KEYSTORE_PASSWORD')
    def legacyKeyAlias = getConfigValue('KEY_ALIAS', 'KEY_ALIAS')
    def legacyKeyPassword = getConfigValue('KEY_PASSWORD', 'KEY_PASSWORD')

    def releaseKeystorePath = getConfigValue('RELEASE_KEYSTORE_PATH', 'RELEASE_KEYSTORE_PATH') ?: legacyKeystorePath
    def releaseKeystorePassword = getConfigValue('RELEASE_KEYSTORE_PASSWORD', 'RELEASE_KEYSTORE_PASSWORD') ?: legacyKeystorePassword
    def releaseKeyAlias = getConfigValue('RELEASE_KEY_ALIAS', 'RELEASE_KEY_ALIAS') ?: legacyKeyAlias
    def releaseKeyPassword = getConfigValue('RELEASE_KEY_PASSWORD', 'RELEASE_KEY_PASSWORD') ?: legacyKeyPassword

    signingConfigs {
        debug {
            if (legacyKeystorePath != null) {
                storeFile file(legacyKeystorePath)
                storePassword legacyKeystorePassword
                keyAlias legacyKeyAlias
                keyPassword legacyKeyPassword
            }
        }
        release {
            if (releaseKeystorePath != null) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    def lifecycle_version = "2.2.0"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"

    def room_version = "2.2.5"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    def okhttp_version = '4.9.0'
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:okhttp-urlconnection:$okhttp_version"

    def glide_version = '4.11.0'
    implementation "com.github.bumptech.glide:glide:$glide_version"
    kapt "com.github.bumptech.glide:compiler:$glide_version"

    implementation 'androidx.core:core-ktx:1.5.0-alpha05'
    implementation 'androidx.paging:paging-runtime-ktx:2.1.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'com.github.Tunous:SwipeActionView:1.3.1'
    implementation 'com.bignerdranch.android:expandablerecyclerview:3.0.0-RC1'
    implementation 'com.github.jrvansuita:MaterialAbout:0.2.3'
    implementation 'net.dankito.readability4j:readability4j:1.0.5'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.rometools:rome-opml:1.15.0'

    testImplementation 'junit:junit:4.13.1'
}
